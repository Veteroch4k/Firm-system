services:
  postgres:
    image: postgres:15
    container_name: firm_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: firm_prod_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: firm_redis
    ports:
      - "6379:6379"
    networks:
      backend:
        aliases:
          - "redis"

  kafka:
    image: apache/kafka:latest
    container_name: firm_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1 # Новые
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    networks:
      backend:
        aliases:
          - "kafka"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=FirmCluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME=${SERVER_IP:-localhost}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8181:8080"
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./observe/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape port
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observe/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - backend

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observe/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
    networks:
      - backend

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - backend
  
  # Сервисы

  config-server:
    build: ../services/backend/config-service
    container_name: config-server
    depends_on:
      vault:
        condition: service_started
      vault-unsealer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8071/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "8071:8071"
    environment:
      - VAULT_HOST=vault
      - VAULT_PORT=8200
      - VAULT_TOKEN=${SPRING_CLOUD_VAULT_TOKEN}
    networks:
      - backend

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_API_ADDR=http://127.0.0.1:8200
    command: vault server -config=/vault/config/vault-config.hcl
    volumes:
      - ./vault:/vault/config:ro
      - vault_data:/vault/file
    cap_add:
      - IPC_LOCK
    networks:
      - backend

  vault-unsealer:
    image: hashicorp/vault:latest
    container_name: vault-unsealer
    depends_on:
      - vault
    environment:
      - VAULT_ADDR=http://vault:8200
      - UNSEAL_KEY_1=${VAULT_UNSEAL_KEY_1}
      - UNSEAL_KEY_2=${VAULT_UNSEAL_KEY_2}
      - UNSEAL_KEY_3=${VAULT_UNSEAL_KEY_3}
    command: >
      sh -c "
      echo 'Ждем старта Vault...' &&
      sleep 5 &&
      vault operator unseal $${UNSEAL_KEY_1} &&
      vault operator unseal $${UNSEAL_KEY_2} &&
      vault operator unseal $${UNSEAL_KEY_3} &&
      echo 'Vault успешно распечатан!'
      "
    networks:
      - backend

  eureka-server:
    build: ../services/backend/eureka-service
    container_name: eureka-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8070/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "8070:8070"
    environment:
      - EUREKA_HOSTNAME=eureka-server
      - CONFIG_SERVER_URL=http://config-server:8071
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - backend

  api-gateway:
    build: ../services/backend/gateway-service
    container_name: api-gateway
    ports:
      - "8072:8072"
    environment:
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8070
      - CONFIG_SERVER_URL=http://config-server:8071
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - TRACING_SAMPLING=1.0
      - OTEL_HOST=otel-collector
      - OTEL_PORT=4318
      - AUTH_SERVER_URL=http://${SERVER_IP:-localhost}:8181

    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - backend

  employer-service:
    build: ../services/backend/employers-service
    container_name: employer-service
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8070
      - CONFIG_SERVER_URL=http://config-server:8071
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - KAFKA_HOST=kafka
      - KAFKA_PORT=29092
      - TRACING_SAMPLING=1.0
      - OTEL_HOST=otel-collector
      - OTEL_PORT=4318
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend

  product-service:
    build: ../services/backend/product-service
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8070
      - CONFIG_SERVER_URL=http://config-server:8071
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - TRACING_SAMPLING=1.0
      - OTEL_HOST=otel-collector
      - OTEL_PORT=4318
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend

  order-service:
    build: ../services/backend/order-service
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - KAFKA_HOST=kafka
      - KAFKA_PORT=29092
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8070
      - CONFIG_SERVER_URL=http://config-server:8071
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - TRACING_SAMPLING=1.0
      - OTEL_HOST=otel-collector
      - OTEL_PORT=4318
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend

  factory-service:
    build: ../services/backend/factory-service
    container_name: factory-service
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - KAFKA_HOST=kafka
      - KAFKA_PORT=29092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8070
      - CONFIG_SERVER_URL=http://config-server:8071
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - TRACING_SAMPLING=1.0
      - OTEL_HOST=otel-collector
      - OTEL_PORT=4318
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend

  warehouse-service:
    build: ../services/backend/warehouse-service
    container_name: warehouse-service
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - KAFKA_HOST=kafka
      - KAFKA_PORT=29092
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8070
      - CONFIG_SERVER_URL=http://config-server:8071
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - TRACING_SAMPLING=1.0
      - OTEL_HOST=otel-collector
      - OTEL_PORT=4318
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend

  toolwarehouse-service:
    build: ../services/backend/toolwarehouse-service
    container_name: toolwarehouse-service
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - KAFKA_HOST=kafka
      - KAFKA_PORT=29092
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8070
      - CONFIG_SERVER_URL=http://config-server:8071
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - TRACING_SAMPLING=1.0
      - OTEL_HOST=otel-collector
      - OTEL_PORT=4318
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend

  admin-service:
    build: ../services/backend/admin-service
    container_name: admin-service
    ports:
      - "8099:8099"
    environment:
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8070
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data:
  vault_data:
