databaseChangeLog:
  - changeSet:
      id: 2
      author: Veteroch4k
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                  name: id
                  type: BIGINT
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: drawing_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_products_drawing
                    references: drawings(id)
                    deleteCascade: true

            tableName: products
