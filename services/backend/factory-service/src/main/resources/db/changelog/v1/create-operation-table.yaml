databaseChangeLog:
  - changeSet:
      id: 1
      author: Veteroch4k
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: name
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: duration
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: factory_id
                  type: BIGINT
            tableName: operations

        - addForeignKeyConstraint:
            baseTableName: operations
            baseColumnNames: factory_id
            referencedTableName: factories
            referencedColumnNames: id
            constraintName: fk_operation_factory
