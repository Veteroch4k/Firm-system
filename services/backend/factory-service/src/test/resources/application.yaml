spring:
  config:
    import: ""

  cloud:
    config:
      enabled: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.migrations-master.yaml
    default-schema: factory_service
    liquibase-schema: factory_service
    contexts: test

  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          MaterialReservationCommand:com.veteroch4k.factory_service.models.commands.MaterialReservationCommand,
          SignOrderCommand:com.veteroch4k.factory_service.models.commands.SignOrderCommand,
          ToolReservationCommand:com.veteroch4k.factory_service.models.commands.ToolReservationCommand,
          MaterialReservedEvent:com.veteroch4k.factory_service.models.events.MaterialReservedEvent,
          OrderCreatedEvent:com.veteroch4k.factory_service.models.events.OrderCreatedEvent,
          ToolReservedEvent:com.veteroch4k.factory_service.models.events.ToolReservedEvent
        spring.json.trusted.packages: "com.veteroch4k.factory_service.models.*"
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: >
          MaterialReservedEvent:com.veteroch4k.factory_service.models.events.MaterialReservedEvent,
          OrderCreatedEvent:com.veteroch4k.factory_service.models.events.OrderCreatedEvent,
          ToolReservedEvent:com.veteroch4k.factory_service.models.events.ToolReservedEvent,
          MaterialReservationCommand:com.veteroch4k.factory_service.models.commands.MaterialReservationCommand,
          SignOrderCommand:com.veteroch4k.factory_service.models.commands.SignOrderCommand,
          ToolReservationCommand:com.veteroch4k.factory_service.models.commands.ToolReservationCommand
        spring.json.trusted.packages: "com.veteroch4k.factory_service.models.*"
      auto-offset-reset: earliest


  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: factory_service

  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false
