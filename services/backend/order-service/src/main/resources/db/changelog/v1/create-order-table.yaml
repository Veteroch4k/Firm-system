databaseChangeLog:
  - changeSet:
      author: Veteroch4k
      id: 1
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  type: BIGINT
                  name: id
              - column:
                  constraints:
                    nullable: false
                  name: product_id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: product_quantity
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  type: DATE
                  name: order_date
              - column:
                  constraints:
                    nullable: false
                  type: DATE
                  name: finish_date
            tableName: orders

        - sql:
            sql: "ALTER TABLE orders ADD CONSTRAINT chk_quantity_positive CHECK (product_quantity > 0);"


