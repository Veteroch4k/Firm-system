spring:
  config:
    import: ""


  cloud:
    config:
      enabled: false


  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          SignOrderCommand:com.veteroch4k.employers.models.commands.SignOrderCommand,
          OrderReadyEvent:com.veteroch4k.employers.models.events.OrderReadyEvent
        spring.json.trusted.packages: "com.veteroch4k.employers.models.*"
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: >
          SignOrderCommand:com.veteroch4k.employers.models.commands.SignOrderCommand,
          OrderReadyEvent:com.veteroch4k.employers.models.events.OrderReadyEvent
        spring.json.trusted.packages: "com.veteroch4k.employers.models.*"
      auto-offset-reset: earliest

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.migrations-master.yaml
    default-schema: employer_service
    liquibase-schema: employer_service

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: employer_service

  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false
