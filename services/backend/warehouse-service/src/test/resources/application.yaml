spring:
  config:
    import: ""

  cloud:
    config:
      enabled: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.migrations-master.yaml
    default-schema: warehouse_service
    liquibase-schema: warehouse_service

  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          MaterialReservationCommand:com.veteroch4k.warehouse.models.commands.MaterialReservationCommand,
          RequiredMaterial:com.veteroch4k.warehouse.models.commands.RequiredMaterial,
          MaterialReservedEvent:com.veteroch4k.warehouse.models.events.MaterialReservedEvent
        spring.json.trusted.packages: "com.veteroch4k.warehouse.models.*"
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: >
          MaterialReservedEvent:com.veteroch4k.warehouse.models.events.MaterialReservedEvent,
          MaterialReservationCommand:com.veteroch4k.warehouse.models.commands.MaterialReservationCommand,
          RequiredMaterial:com.veteroch4k.warehouse.models.commands.RequiredMaterial
        spring.json.trusted.packages: "com.veteroch4k.warehouse.models.*"
      auto-offset-reset: earliest


  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: warehouse_service

  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

