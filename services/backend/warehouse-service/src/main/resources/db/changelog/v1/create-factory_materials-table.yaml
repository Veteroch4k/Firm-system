databaseChangeLog:
  - changeSet:
      author: Veteroch4k
      id: create-factory_materials-table
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                  name: id
                  type: BIGINT

              - column:
                  constraints:
                    nullable: false
                  name: factory_id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: material_id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: quantity
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: created_at
                  type: DATE
            tableName: factory_materials
        - addForeignKeyConstraint:
            baseTableName: factory_materials
            baseColumnNames: material_id
            referencedTableName: materials
            referencedColumnNames: id
            constraintName: fk_factory_materials_materials