databaseChangeLog:
  - changeSet:
      id: create-factory_tools-table
      author: Veteroch4k
      changes:
        - createTable:
            tableName: factory_tools
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                  name: id
                  type: BIGINT

              - column:
                  constraints:
                    nullable: false
                  name: factory_id
                  type: BIGINT

              - column:
                  constraints:
                    nullable: false
                  name: tooltype_id
                  type: BIGINT
              - column:
                  name: quantity
                  type: BIGINT
                  constraints:
                    nullable: false
                    checkConstraint: "quantity >= 0"

        - addForeignKeyConstraint:
            baseTableName: factory_tools
            baseColumnNames: tooltype_id
            referencedTableName: tool_types
            referencedColumnNames: id
            constraintName: fk_factory_tools_tool_types


