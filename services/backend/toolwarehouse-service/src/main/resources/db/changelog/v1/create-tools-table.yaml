databaseChangeLog:
  - changeSet:
      id: create-tools-table
      author: Veteroch4k
      changes:
        - createTable:
            tableName: tools
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: tooltype_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: tools
            baseColumnNames: tooltype_id
            referencedTableName: tool_types
            referencedColumnNames: id
            constraintName: fk_tools_tool_types

