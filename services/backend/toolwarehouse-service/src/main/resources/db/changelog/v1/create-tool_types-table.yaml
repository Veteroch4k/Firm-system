databaseChangeLog:
  - changeSet:
      id: create-tool_types-table
      author: Veteroch4k
      changes:
        - createTable:
            tableName: tool_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: VARCHAR(25)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

        - addUniqueConstraint:
            tableName: tool_types
            columnNames: name
            constraintName: uk_name_unique