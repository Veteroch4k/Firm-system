databaseChangeLog:
  - changeSet:
      id: create-tools_accounting-table
      author: Veteroch4k
      changes:
        - sql:
            sql: "CREATE TYPE movement_type AS ENUM('INCOME', 'OUTCOME', 'TRANSFER')"
        - createTable:
            tableName: tools_accounting
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: tooltype_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  constraints:
                    nullable: false
                    checkConstraint: "quantity >= 0"
                  type: BIGINT
                  name: quantity

              - column:
                  name: factory_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  constraints:
                    nullable: false
                  type: BIGINT
                  name: employee_id

              - column:
                  constraints:
                    nullable: false
                  type: movement_type
                  name: type

              - column:
                  constraints:
                    nullable: false
                  type: DATE
                  name: date

        - addForeignKeyConstraint:
            baseTableName: tools_accounting
            baseColumnNames: toolType_id
            referencedTableName: toolTypes
            referencedColumnNames: id
            constraintName: fk_tools_accounting_toolTypes