name: Deploy Firm-system

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-n

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run Gradle tests
        run: ./gradlew test --no-daemon

      - name: Run Maven tests
        run: ./mvnw test

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env
        env:
          VAULT_TOKEN: ${{ secrets.SPRING_CLOUD_VAULT_TOKEN }}
          UNSEAL_1: ${{ secrets.VAULT_UNSEAL_KEY_1 }}
          UNSEAL_2: ${{ secrets.VAULT_UNSEAL_KEY_2 }}
          UNSEAL_3: ${{ secrets.VAULT_UNSEAL_KEY_3 }}
        run: |
          {
            echo "SPRING_CLOUD_VAULT_TOKEN=$VAULT_TOKEN"
            echo "VAULT_UNSEAL_KEY_1=$UNSEAL_1"
            echo "VAULT_UNSEAL_KEY_2=$UNSEAL_2"
            echo "VAULT_UNSEAL_KEY_3=$UNSEAL_3"
          } > docker/.env

      - name: Deploy
        run: docker compose -f docker/docker-compose.yaml up -d --build

      - name: Check containers
        run: docker compose -f docker/docker-compose.yaml ps