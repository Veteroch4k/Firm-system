name: Deploy Firm-system

on:
  push:
    branches: [ master, 'feature/**' ]
    paths:
      - 'services/**'
      - 'docker/**'
      - 'build.gradle'
      - 'settings.gradle'
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Gradle tests
        run: ./gradlew test --no-daemon

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build JARs
        run: ./gradlew bootJar --no-daemon -x test

      - name: Create .env
        env:
          VAULT_TOKEN: ${{ secrets.SPRING_CLOUD_VAULT_TOKEN }}
          UNSEAL_1: ${{ secrets.VAULT_UNSEAL_KEY_1 }}
          UNSEAL_2: ${{ secrets.VAULT_UNSEAL_KEY_2 }}
          UNSEAL_3: ${{ secrets.VAULT_UNSEAL_KEY_3 }}
          SERVERIP: ${{ secrets.SERVER_IP }}
        run: |
          {
            echo "SPRING_CLOUD_VAULT_TOKEN=$VAULT_TOKEN"
            echo "VAULT_UNSEAL_KEY_1=$UNSEAL_1"
            echo "VAULT_UNSEAL_KEY_2=$UNSEAL_2"
            echo "VAULT_UNSEAL_KEY_3=$UNSEAL_3"
            echo "SERVER_IP=$SERVERIP"
          } > docker/.env

      - name: Deploy
        run: docker compose -f docker/docker-compose.yaml up -d --build

      - name: Check containers
        run: docker compose -f docker/docker-compose.yaml ps